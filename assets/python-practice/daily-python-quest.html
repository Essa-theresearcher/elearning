<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Python Quest</title>
<style>
:root{--bg:#FBF7EA;--card:#fff;--ink:#14284B;--mut:#5b6679;--gold:#C9A227;--ok:#1f9d57;--bad:#d64545;--code:#EEF1F7;--line:#d9dde6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a33;--card:#16264a;--ink:#f3efe0;--mut:#a9b3c7;--code:#0b1530;--line:#2b3d68}}
:root[data-theme="dark"]{--bg:#0e1a33;--card:#16264a;--ink:#f3efe0;--mut:#a9b3c7;--code:#0b1530;--line:#2b3d68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.path{display:flex;align-items:center;margin:16px 4px}
.node{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.node.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,.25)}
.node.done{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:4px;background:var(--line);flex:1}.bar.done{background:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:#14284B;background:var(--gold);border-radius:6px;padding:2px 8px;margin-bottom:8px}
pre{background:var(--code);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;margin:10px 0;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.opts{display:grid;gap:8px;margin-top:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.opt:hover{border-color:var(--gold)}
.opt.bad{border-color:var(--bad);background:rgba(214,69,69,.12);animation:sh .3s}
.opt.good{border-color:var(--ok);background:rgba(31,157,87,.15)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bulb{display:flex;gap:4px;font-size:18px}.bulb span{opacity:.25}.bulb span.on{opacity:1}
.hint{background:rgba(201,162,39,.16);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.tiles{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tile{background:var(--code);border:2px solid var(--line);border-radius:8px;padding:6px 10px;font:14px ui-monospace,Menlo,Consolas,monospace;white-space:pre;text-align:left;overflow-x:auto}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px;margin-top:6px}
.mem{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.box{border:2px solid var(--ink);border-radius:8px;min-width:78px;text-align:center;overflow:hidden;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.box b{display:block;background:var(--ink);color:var(--bg);padding:1px 6px}.box i{display:block;font-style:normal;padding:4px 6px}
.fb{margin-top:10px;font-weight:600}
.stars{font-size:20px;letter-spacing:2px}
.week{display:flex;gap:6px;justify-content:center;margin-top:10px}
.day{width:34px;text-align:center;font-size:11px;color:var(--mut)}
.day div{width:26px;height:26px;margin:2px auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.day div.on{background:var(--gold);border-color:var(--gold);color:#14284B;font-weight:700}
.center{text-align:center}
.big{font-size:44px}
</style>
<link rel="stylesheet" href="thinking-coach.css">
</head>
<body><div class="wrap">
<div class="top"><h1>🐍 Daily Python Quest</h1><div><span class="pill" id="streak">🔥 0</span> <span class="pill" id="xp">⭐ 0</span></div></div>
<div class="path" id="path"></div>
<div class="card" id="main"></div>
<p class="center" style="color:var(--mut);font-size:13px" id="practiceBlurb">8 predict-and-reason challenges today. Wrong answers show step-by-step thinking — hints cost stars, so try first.</p>
</div>
<script src="thinking-coach.js"></script>
<script>
var POOL=[
{t:"Predict",q:"What does this print?",code:"x = 5\ny = x * 2\nx = 3\nprint(y)",o:["10","6","5","15"],a:0,mem:{x:"3",y:"10"},h:["Python runs one line at a time, top to bottom.","y gets its value on line 2, when x is 5.","Changing x later does not change y."]},
{t:"Predict",q:"What does this print?",code:"print('5' * 3)",o:["15","555","5 5 5","Error"],a:1,mem:{},h:["The 5 is inside quotes.","So it is text, not a number.","Text times 3 repeats the text."]},
{t:"Predict",q:"What does this print?",code:"a = '7'\nb = '3'\nprint(a + b)",o:["10","73","'7'3","Error"],a:1,mem:{a:"'7'",b:"'3'"},h:["Look at the quotes again.","Both values are text.","+ joins text together."]},
{t:"Predict",q:"What does this print?",code:"price = 1000\nqty = 3\ntotal = price * qty * 1.16\nprint(round(total))",o:["3000","3480","3480.0","3.48"],a:1,mem:{price:"1000",qty:"3",total:"3480.0"},h:["First work out price * qty.","Then multiply by 1.16: 3000 x 1.16.","round() with no second value gives a whole number."]},
{t:"Fix the bug",q:"Which line causes an error?",code:"1  age = input('Age: ')\n2  next_year = age + 1\n3  print(next_year)",o:["Line 1","Line 2","Line 3"],a:1,mem:{age:"'17' (text!)"},h:["input() always gives text.","Which line mixes text and a number?","You need int(age) before adding 1."]},
{t:"Fill the blank",q:"Make the score go up by 1 for every question.",code:"score = 0\nfor q in range(5):\n    ______\nprint(score)",o:["score += 1","score = 1","score + 1","score == 1"],a:0,mem:{score:"5"},h:["The line must change score, not just calculate.","= replaces the value, so it would always be 1.","+= adds to what is already there."]},
{t:"Predict",q:"What does this print?",code:"for i in range(3):\n    print(i)",o:["1 2 3","0 1 2","0 1 2 3","3"],a:1,mem:{i:"2"},h:["range(3) makes 3 numbers.","Counting starts at 0.","So: 0, 1, 2."]},
{t:"Predict",q:"What does this print?",code:"m = 65\nif m >= 70:\n    print('B')\nelif m >= 60:\n    print('C')\nelse:\n    print('D')",o:["B","C","D","B and C"],a:1,mem:{m:"65"},h:["Python checks conditions in order.","Is 65 >= 70?","Only the first true branch runs."]},
{t:"Put in order",q:"Tap the lines in the right order to get the average.",lines:["marks = [60, 70, 80]","total = 0","for m in marks:","    total += m","print(total / len(marks))"],mem:{total:"210",marks:"[60, 70, 80]"},h:["Create the list and the total first.","The loop comes before the print.","The indented line belongs inside the loop."]},
{t:"Put in order",q:"Tap the lines in the right order.",lines:["def add_vat(amount):","    return amount * 1.16","print(add_vat(100))"],mem:{"add_vat(100)":"116.0"},h:["A function must be defined before it is used.","def line first, then its body.","The call comes last."]},
{t:"Predict",q:"What does this print?",code:"nums = [4, 8, 15]\nnums.append(16)\nprint(len(nums))",o:["3","4","16","Error"],a:1,mem:{nums:"[4, 8, 15, 16]"},h:["append adds one item to the end.","How many items are in the list now?","len() counts the items."]},
{t:"Predict",q:"What does this print?",code:"d = {'rice': 180, 'milk': 60}\nprint(d['milk'] + 10)",o:["70","60","190","Error"],a:0,mem:{d:"{rice: 180, milk: 60}"},h:["The key picks out a value.","d['milk'] is 60.","Then add 10."]},
{t:"Predict",q:"What happens?",code:"d = {'a': 1}\nprint(d['b'])",o:["1","None","KeyError","0"],a:2,mem:{d:"{a: 1}"},h:["Is there a key called 'b'?","Python does not guess a missing key.","It stops with an error."]},
{t:"Predict",q:"What does this print?",code:"def f(x):\n    x * 2\n\nprint(f(4))",o:["8","4","None","Error"],a:2,mem:{"f(4)":"None"},h:["Look for the word return.","Without return, a function gives nothing back.","Nothing in Python is called None."]},
{t:"Predict (API)",q:"A weather API returned this. What prints?",code:"data = {'current_weather': {'temperature': 24.5}}\nprint(data['current_weather']['temperature'])",o:["24.5","current_weather","{'temperature': 24.5}","Error"],a:0,mem:{temperature:"24.5"},h:["JSON is just dictionaries inside dictionaries.","Open the outer key first.","Then open the inner key."]},
{t:"Predict",q:"What does this print?",code:"word = 'Hi'\nprint(len(word))",o:["2","Hi","len(word)","Error"],a:0,mem:{word:"'Hi'"},h:["len() counts characters in text.","Quotes mean it is a string.","Two letters → 2."]},
{t:"Fix the bug",q:"Which line causes an error?",code:"1  name = 'Amina'\n2  print('Hello ' + name)\n3  print('You are ' + 17)",o:["Line 1","Line 2","Line 3"],a:2,mem:{name:"'Amina'"},h:["Line 2 joins text to text — that works.","Line 3 mixes text and a number with +.","Use str(17) or an f-string."]},
{t:"Predict",q:"What does this print?",code:"s = '  cat  '\nprint(s.strip().upper())",o:["  cat  ","CAT","cat","Error"],a:1,mem:{s:"'  cat  '"},h:["strip() removes spaces at the ends.","upper() makes letters capitals.","Result is CAT with no spaces."]},
{t:"Predict",q:"What does this print?",code:"x = input('Enter a number: ')\nprint(x + 1)",o:["Depends on input","Error","1","11 if user typed 1"],a:1,mem:{x:"always text from input()"},h:["input() returns text, even for digits.","You cannot add text and a number with +.","You need int(x) first."]},
{t:"Fill the blank",q:"Make this print 3 without changing the quotes.",code:"a = '1'\nb = '2'\nprint(______)",o:["a + b","int(a) + int(b)","a + 1","str(a + b)"],a:1,mem:{"int(a)+int(b)":"3"},h:["a and b are text, not numbers.","Convert both before adding.","int(a) + int(b) gives 3."]}
];
var $=function(i){return document.getElementById(i)};
var S={};try{S=JSON.parse(localStorage.getItem("pq")||"{}")}catch(e){}
function save(){try{localStorage.setItem("pq",JSON.stringify(S))}catch(e){}}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function dayNum(){var d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
S.streak=S.streak||0;S.xp=S.xp||0;S.hist=S.hist||{};
var set=[],i=0,res=[],hints=0,wrongs=0,done=false,pick=[],shuf=[];
var qp=new URLSearchParams(location.search);
var weekDay=parseInt(qp.get("dbaDay")||String(new Date().getDay()),10);
var dbaDate=qp.get("dbaDate")||"";
var PREDICT_N=Math.min(12,Math.max(5,parseInt(qp.get("dbaPredictCount")||"8",10)));
(function(){var b=document.getElementById("practiceBlurb");if(b)b.textContent=PREDICT_N+" predict-and-reason challenges today. Wrong answers show step-by-step thinking — hints cost stars, so try first.";})();
function todaySet(){var shift=parseInt(qp.get("dbaPredictShift")||"0",10);var s=[],st=(dayNum()*PREDICT_N+weekDay*7+shift)%POOL.length;for(var k=0;k<PREDICT_N;k++)s.push(POOL[(st+k)%POOL.length]);return s}
function notifyDayTask(task){if(!dbaDate||!window.parent)return;try{window.parent.postMessage({type:"pp-day-task",task:task,date:dbaDate},"*");}catch(e){}}
function head(){$("streak").textContent="🔥 "+S.streak;$("xp").textContent="⭐ "+S.xp;
 var h="";for(var k=0;k<PREDICT_N;k++){h+=(k?'<div class="bar '+(k<=i&&k<=res.length?'done':'')+'"></div>':'')+'<div class="node '+(k<res.length?'done':k==i?'cur':'')+'">'+(k<res.length?'✓':k+1)+'</div>'}$("path").innerHTML=h}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function mem(m){var h="",k;for(k in m)h+='<div class="box"><b>'+esc(k)+'</b><i>'+esc(m[k])+'</i></div>';return h?'<div class="mem">'+h+'</div>':""}
function show(){var c=set[i];done=false;hints=0;wrongs=0;pick=[];head();
 var h='<span class="tag">'+c.t+'</span><div><b>'+c.q+'</b></div>';
 if(c.lines){shuf=c.lines.map(function(l,k){return k}).sort(function(){return Math.random()-.5});h+='<div class="slot" id="slot"></div><div class="tiles" id="bank"></div>'}
 else{h+='<pre>'+esc(c.code)+'</pre><div class="opts">'+c.o.map(function(o,k){return'<button class="opt" onclick="ans('+k+',this)">'+esc(o)+'</button>'}).join("")+'</div>'}
 h+='<div id="fb" class="fb"></div><div id="hn"></div><div class="row"><button class="btn ghost" id="hb" onclick="hint()">💡 Hint</button><div class="bulb" id="bulb"><span>💡</span><span>💡</span><span>💡</span></div><div style="flex:1"></div><button class="btn" id="nx" style="display:none" onclick="next()">Next →</button></div>';
 $("main").innerHTML=h;if(c.lines){tiles();$("bank").innerHTML+='<div class="row"><button class="btn" onclick="chk()">Check order</button></div>'}}
function tiles(){var c=set[i];$("slot").innerHTML=pick.length?pick.map(function(k,p){return'<div class="tile" style="margin-bottom:4px;cursor:pointer" onclick="unpick('+p+')">'+esc(c.lines[k])+'</div>'}).join(""):'<span style="color:var(--mut);font-size:13px">Tap lines below to build your program</span>';
 var b=shuf.filter(function(k){return pick.indexOf(k)<0});$("bank").innerHTML=b.map(function(k){return'<button class="tile" onclick="add('+k+')">'+esc(c.lines[k])+'</button>'}).join("")}
function add(k){if(done)return;pick.push(k);tiles();$("bank").innerHTML+='<div class="row"><button class="btn" onclick="chk()">Check order</button></div>'}
function unpick(p){if(done)return;pick.splice(p,1);tiles();$("bank").innerHTML+='<div class="row"><button class="btn" onclick="chk()">Check order</button></div>'}
function stars(){return Math.max(1,3-hints-wrongs)}
function win(){var c=set[i];done=true;var st=stars();res.push(st);
 var whyText=c.why||(c.h&&c.h.length?c.h[c.h.length-1]:"");
 var why=whyText?'<div class="hint"><b>Why this is right:</b> '+whyText+'</div>':'';
 $("fb").innerHTML='<span style="color:var(--ok)">Correct! '+"⭐".repeat(st)+'</span>'+why+mem(c.mem);$("nx").style.display="";$("hb").style.display="none";
 if(i==PREDICT_N-1)$("nx").textContent="Finish 🎉"}
function ans(k,el){if(done)return;var c=set[i];if(k==c.a){el.classList.add("good");if(window.ThinkingCoach)ThinkingCoach.resetStruggle();win()}else{el.classList.add("bad");wrongs++;var fb=window.ThinkingCoach?ThinkingCoach.wrongChoiceHtml(c,k):'<span style="color:var(--bad)">Not yet.</span>';if(window.ThinkingCoach)fb+=ThinkingCoach.recordStruggle();$("fb").innerHTML=fb}}
function chk(){if(done)return;var c=set[i];var ok=pick.length==c.lines.length&&pick.every(function(k,p){return k==p});
 if(ok){if(window.ThinkingCoach)ThinkingCoach.resetStruggle();win()}else{wrongs++;var fb=window.ThinkingCoach?ThinkingCoach.wrongOrderHtml(c):'<span style="color:var(--bad)">Not quite.</span>';if(window.ThinkingCoach)fb+=ThinkingCoach.recordStruggle();$("fb").innerHTML=fb;$("slot").style.animation="sh .3s";setTimeout(function(){$("slot").style.animation=""},300)}}
function hint(){if(hints>=3||done)return;$("hn").insertAdjacentHTML("beforeend",'<div class="hint">💡 Hint '+(hints+1)+': '+set[i].h[hints]+'</div>');hints++;
 var b=$("bulb").children;for(var k=0;k<hints;k++)b[k].className="on";if(hints>=3)$("hb").style.display="none"}
function next(){if(i<PREDICT_N-1){i++;show()}else finish()}
function finish(){notifyDayTask("predict");var tot=res.reduce(function(a,b){return a+b},0),t=dk(),y=dk(new Date(Date.now()-864e5)),first=!S.hist[t];
 if(first){S.streak=(S.last==y)?S.streak+1:1;S.last=t;S.xp+=tot*10;S.hist[t]=tot;save()}
 var maxStars=PREDICT_N*3;
 head();var msg=tot>=maxStars*0.85?"Brilliant. You barely needed hints.":tot>=maxStars*0.6?"Strong work. You are building real skill.":"You finished all "+PREDICT_N+". Finishing is what counts, and tomorrow is a new set.";
 var w="",k;for(k=6;k>=0;k--){var d=new Date(Date.now()-k*864e5),on=S.hist[dk(d)];w+='<div class="day">'+"SMTWTFS"[d.getDay()]+'<div class="'+(on?'on':'')+'">'+(on?'✓':'')+'</div></div>'}
 $("main").innerHTML='<div class="center"><div class="big">'+(tot>=maxStars*0.85?"🏆":tot>=maxStars*0.6?"🌟":"💪")+'</div><h2 style="margin:4px 0">Day complete</h2><div class="stars">'+tot+' / '+maxStars+' ⭐</div><p>'+msg+'</p>'+
 (first?'<p><b>+'+tot*10+' XP</b> · Streak: 🔥 '+S.streak+' day'+(S.streak==1?'':'s')+'</p>':'<p style="color:var(--mut)">Practice round. Your streak was already counted today.</p>')+
 '<div class="week">'+w+'</div><div class="row" style="justify-content:center"><button class="btn" onclick="start()">Play again for practice</button></div></div>'}
function start(){set=todaySet();i=0;res=[];show()}
start();
</script></body></html>
