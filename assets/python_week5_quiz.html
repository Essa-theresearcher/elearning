<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Python Lesson 1 Practice Quiz - Digital Bridge Academy</title>
<style>
  :root{--navy:#132A4C;--navy-dark:#0B1B33;--gold:#C9A227;--ivory:#FAF6EC;--charcoal:#2B2B2B;--soft-grey:#6E6E6E;--line:#E3D9BE;--correct:#2F6B52;--correct-bg:#EAF3EE;--incorrect:#A04242;--incorrect-bg:#F8EAEA;}
  *{box-sizing:border-box} body{margin:0;background:var(--ivory);color:var(--charcoal);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:hidden}
  .topbar{background:var(--navy);border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .brand{color:#fff;font-weight:800}.lesson-tag{color:#D9CDA3;font-size:12.5px}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 70px}.hero{text-align:center;margin-bottom:20px}
  .kicker{color:var(--gold);font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
  h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:28px;margin:6px 0}.hero p{color:var(--soft-grey);font-size:14px;margin:0 auto;max-width:580px}
  .progress-text{text-align:center;font-size:12.5px;color:var(--soft-grey);margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px;margin-bottom:18px;box-shadow:0 1px 3px rgba(19,42,76,.06)}
  .category-tag{display:inline-block;background:var(--ivory);border:1px solid var(--line);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:3px;margin-bottom:14px}
  .question{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5;color:var(--navy-dark);margin:0 0 16px}
  .options{display:flex;flex-direction:column;gap:9px}
  .option{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:12px 14px;font-size:14px;color:var(--charcoal);cursor:pointer;font-family:inherit}
  .option:hover:not(:disabled){border-color:var(--gold);background:var(--ivory)}
  .option.correct-answer{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);font-weight:800}
  .option.wrong-answer{border-color:var(--incorrect);background:var(--incorrect-bg);color:var(--incorrect);font-weight:800}
  .option.dimmed{opacity:.55}
  .feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:5px;font-size:13.5px;line-height:1.55}
  .feedback.show{display:block}.feedback.is-correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
  .feedback.is-incorrect{background:var(--incorrect-bg);color:var(--incorrect);border:1px solid var(--incorrect)}
  .feedback b{display:block;margin-bottom:4px}.next-btn{display:none;margin-top:16px;background:var(--navy);color:#fff;border:none;border-radius:5px;padding:10px 18px;font-weight:800;cursor:pointer}
  .next-btn.show{display:inline-block}.results{display:none;text-align:center}.results.show{display:block}
  .score-hero{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;margin-bottom:18px}
  .big{font-family:Georgia,"Times New Roman",serif;font-size:52px;color:var(--navy);font-weight:800}.big span{color:var(--gold)}.msg{color:var(--soft-grey)}
  .cat-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0;font-size:14px}
  .restart{background:none;border:1.5px solid var(--navy);color:var(--navy);border-radius:5px;padding:10px 18px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><span class="brand">Digital Bridge Academy</span><span class="lesson-tag">Python Fundamentals · Week 5 Quiz</span></div>
<div class="wrap">
  <div class="hero"><span class="kicker">Post-lesson check</span><h1>Practice Quiz: Functions &amp; Repetition</h1><p>12 questions on while, for, range(), and loop patterns.</p></div>
  <div id="quizScreen"><p class="progress-text" id="progressText"></p><div class="card"><span class="category-tag" id="categoryTag"></span><p class="question" id="questionText"></p><div class="options" id="optionsWrap"></div><div class="feedback" id="feedback"><b id="feedbackLabel"></b><span id="feedbackExplain"></span></div><button class="next-btn" id="nextBtn" type="button">Next question</button></div></div>
  <div class="results" id="resultsScreen"><div class="score-hero"><div class="big" id="scoreBig"></div><p class="msg" id="scoreMsg"></p></div><div class="card" id="categoryBreakdown"></div><button class="restart" id="restartBtn" type="button">Retake quiz</button></div>
</div>
<script src="quiz-where.js"></script>
<script>
(function(){
  const QUESTIONS = [
    {category:'for/range',question:'list(range(3)) gives…',options:['[1,2,3]','[0,1,2]','[3]','[0,3]'],correct:1,explanation:'range(3) is 0, 1, 2.'},
    {category:'for/range',question:'range(2, 5) includes which last value?',options:['5','4','2','6'],correct:1,explanation:'Stop is exclusive — ends at 4.'},
    {category:'while',question:'A while loop checks its condition…',options:['Once at the end','Before each iteration','Never','Only if break is used'],correct:1,explanation:'Condition tested before each pass.'},
    {category:'while',question:'n=0; while n<3: n+=1 — how many iterations?',options:['2','3','4','Infinite'],correct:1,explanation:'n goes 0→1→2→3; stops when n<3 is false.'},
    {category:'Trace',question:'for i in range(2): print(i) prints…',options:['0 then 1','1 then 2','2 lines of 2','Nothing'],correct:0,explanation:'range(2) → 0, 1.'},
    {category:'Accumulator',question:'total=0; for k in range(1,4): total+=k — total is…',options:['3','6','4','10'],correct:1,explanation:'1+2+3=6.'},
    {category:'Infinite',question:'n=0; while n<5: print(n) without n+=1 will…',options:['Print once','Loop forever printing 0','Error immediately','Print 0..4'],correct:1,explanation:'Counter never changes — infinite loop.'},
    {category:'for vs while',question:'Best for "repeat until user guesses right"?',options:['for only','while','print only','if only'],correct:1,explanation:'Unknown repetitions → while.'},
    {category:'for vs while',question:'Best for "print 1 through 10"?',options:['while only','for with range','input only','elif chain'],correct:1,explanation:'Known count → for/range.'},
    {category:'Syntax',question:'Loop body lines must be…',options:['Unindented','Indented under the loop header','In quotes','After break only'],correct:1,explanation:'Same block rules as if.'},
    {category:'Operators',question:'n += 1 means…',options:['n = 1','n = n + 1','n == 1','add n to the file'],correct:1,explanation:'Shorthand increment.'},
    {category:'Mindset',question:'If a loop runs too long, you should…',options:['Unplug the PC','Check whether the stop condition can become false','Delete Python','Remove indentation'],correct:1,explanation:'Fix the counter or condition.'}
  ];
  const TOTAL = QUESTIONS.length;
  let current = 0, score = 0, answered = false, answerDetails = [];
  const catStats = {};
  QUESTIONS.forEach(function(q){ if(!catStats[q.category]) catStats[q.category]={correct:0,total:0}; catStats[q.category].total++; });
  const quizScreen=document.getElementById('quizScreen'),resultsScreen=document.getElementById('resultsScreen'),progressTextEl=document.getElementById('progressText'),categoryTagEl=document.getElementById('categoryTag'),questionTextEl=document.getElementById('questionText'),optionsWrapEl=document.getElementById('optionsWrap'),feedbackEl=document.getElementById('feedback'),feedbackLabelEl=document.getElementById('feedbackLabel'),feedbackExplainEl=document.getElementById('feedbackExplain'),nextBtn=document.getElementById('nextBtn');
  function renderQuestion(){ answered=false; const q=QUESTIONS[current]; categoryTagEl.textContent=q.category; questionTextEl.textContent=q.question; optionsWrapEl.innerHTML=''; q.options.forEach(function(opt,idx){ const btn=document.createElement('button'); btn.className='option'; btn.type='button'; btn.textContent=opt; btn.addEventListener('click',function(){ selectOption(idx); }); optionsWrapEl.appendChild(btn); }); feedbackEl.className='feedback'; nextBtn.classList.remove('show'); progressTextEl.textContent=window.QuizWhere?QuizWhere.progressLabel(current,TOTAL):('Question '+(current+1)+' of '+TOTAL); if(window.QuizWhere)QuizWhere.paintStages(current,TOTAL); }
  function selectOption(idx){ if(answered) return; answered=true; const q=QUESTIONS[current]; const buttons=optionsWrapEl.querySelectorAll('.option'); const isCorrect=idx===q.correct; answerDetails[current]={questionNumber:current+1,category:q.category,question:q.question,selectedAnswer:q.options[idx],correctAnswer:q.options[q.correct],isCorrect:isCorrect,explanation:q.explanation,section:'full'}; if(isCorrect){ buttons.forEach(function(btn,i){ btn.disabled=true; if(i===idx) btn.classList.add('correct-answer'); else btn.classList.add('dimmed'); }); score++; catStats[q.category].correct++; feedbackEl.className='feedback show is-correct'; feedbackLabelEl.textContent='That matches.'; feedbackExplainEl.textContent='Why this is right: '+q.explanation; } else if(window.QuizWhere){ QuizWhere.showMiss({buttons:buttons,feedbackEl:feedbackEl,feedbackLabelEl:feedbackLabelEl,feedbackExplainEl:feedbackExplainEl}, q, idx); } else { buttons.forEach(function(btn,i){ btn.disabled=true; if(i===idx) btn.classList.add('wrong-answer'); else btn.classList.add('dimmed'); }); feedbackEl.className='feedback show is-incorrect'; feedbackLabelEl.textContent='Where to look'; feedbackExplainEl.textContent='You chose '+q.options[idx]+'. Reread the question.'; } nextBtn.textContent=(current===TOTAL-1)?'See results':'Next question'; nextBtn.classList.add('show'); }
  nextBtn.addEventListener('click',function(){ current++; if(current>=TOTAL) showResults(); else renderQuestion(); });
  function saveQuizResult(){ fetch('/api/progress/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonSlug:'python-beginner-lesson-5',section:'full',score:score,totalQuestions:TOTAL,categoryBreakdown:catStats,answerDetails:answerDetails})}).catch(function(){}); }
  function showResults(){ quizScreen.style.display='none'; resultsScreen.classList.add('show'); saveQuizResult(); const pct=Math.round((score/TOTAL)*100); document.getElementById('scoreBig').innerHTML=score+'<span>/'+TOTAL+'</span>'; let msg=pct>=90?'Excellent — Fundamentals complete!':pct>=70?'Solid — review weak categories, then continue.':'Review Week 5 notes and lab, then retake.'; document.getElementById('scoreMsg').textContent=pct+'% — '+msg; const breakdown=document.getElementById('categoryBreakdown'); breakdown.innerHTML=''; Object.keys(catStats).forEach(function(cat){ const s=catStats[cat]; const row=document.createElement('div'); row.className='cat-row'; row.innerHTML='<span>'+cat+'</span><span>'+s.correct+' / '+s.total+'</span>'; breakdown.appendChild(row); }); }
  document.getElementById('restartBtn').addEventListener('click',function(){ current=0; score=0; answered=false; answerDetails=[]; Object.keys(catStats).forEach(function(c){ catStats[c].correct=0; }); quizScreen.style.display=''; resultsScreen.classList.remove('show'); renderQuestion(); });
  renderQuestion();
})();
</script>
</body>
</html>
