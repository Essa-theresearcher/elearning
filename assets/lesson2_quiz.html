<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson 2 Practice Quiz — Digital Bridge Academy</title>
<style>
  :root{
    --navy:#132A4C;
    --navy-dark:#0B1B33;
    --gold:#C9A227;
    --ivory:#FAF6EC;
    --charcoal:#2B2B2B;
    --soft-grey:#6E6E6E;
    --line:#E3D9BE;
    --correct:#2F6B52;
    --correct-bg:#EAF3EE;
    --incorrect:#8C3A3A;
    --incorrect-bg:#F6EBEA;
    --code-bg:#0F1F38;
    --code-text:#E8E3D3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--charcoal);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:var(--navy);
    border-bottom:3px solid var(--gold);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .topbar .brand{
    color:#fff;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.03em;
  }
  .topbar .lesson-tag{
    color:#D9CDA3;
    font-size:12.5px;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:28px 18px 60px;
  }
  .hero{
    text-align:center;
    margin-bottom:22px;
  }
  .hero .kicker{
    color:var(--gold);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .hero h1{
    font-family:Georgia, "Times New Roman", serif;
    color:var(--navy);
    font-size:26px;
    margin:6px 0 4px;
  }
  .hero p{
    color:var(--soft-grey);
    font-size:14px;
    margin:0;
  }

  /* Byte meter — signature element */
  .byte-meter{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin:22px 0 6px;
    flex-wrap:wrap;
  }
  .bits{
    display:flex;
    gap:5px;
  }
  .bit{
    width:22px;
    height:22px;
    border:1.5px solid var(--line);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Courier New", Courier, monospace;
    font-size:11px;
    color:var(--soft-grey);
    background:#fff;
  }
  .bit.on{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--gold);
    font-weight:700;
  }
  @media (prefers-reduced-motion: no-preference){
    .bit{ transition: background .35s ease, color .35s ease, border-color .35s ease; }
  }
  .byte-readout{
    font-family:"Courier New", Courier, monospace;
    font-size:12.5px;
    color:var(--soft-grey);
    text-align:center;
    margin-bottom:22px;
  }
  .byte-readout b{ color:var(--navy); }

  .progress-text{
    text-align:center;
    font-size:12.5px;
    color:var(--soft-grey);
    margin-bottom:18px;
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px 26px 22px;
    box-shadow:0 1px 3px rgba(19,42,76,0.06);
  }
  .category-tag{
    display:inline-block;
    background:var(--ivory);
    border:1px solid var(--line);
    color:var(--navy);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:3px;
    margin-bottom:14px;
  }
  .question{
    font-family:Georgia, "Times New Roman", serif;
    font-size:17.5px;
    line-height:1.5;
    color:var(--navy-dark);
    margin:0 0 16px;
  }
  .code-block{
    background:var(--code-bg);
    color:var(--code-text);
    font-family:"Courier New", Courier, monospace;
    font-size:13.5px;
    padding:14px 16px;
    border-radius:4px;
    margin-bottom:16px;
    white-space:pre;
    overflow-x:auto;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .option{
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:5px;
    padding:12px 14px;
    font-size:14px;
    color:var(--charcoal);
    cursor:pointer;
    font-family:inherit;
  }
  @media (prefers-reduced-motion: no-preference){
    .option{ transition: border-color .15s ease, background .15s ease; }
  }
  .option:hover:not(:disabled){
    border-color:var(--gold);
    background:var(--ivory);
  }
  .option:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .option:disabled{ cursor:default; }
  .option.correct-answer{
    border-color:var(--correct);
    background:var(--correct-bg);
    color:var(--correct);
    font-weight:700;
  }
  .option.wrong-answer{
    border-color:var(--incorrect);
    background:var(--incorrect-bg);
    color:var(--incorrect);
    font-weight:700;
  }
  .option.dimmed{ opacity:0.5; }

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:5px;
    font-size:13.5px;
    line-height:1.55;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.is-correct{ background:var(--correct-bg); color:var(--correct); border:1px solid var(--correct); }
  .feedback.is-incorrect{ background:var(--incorrect-bg); color:var(--incorrect); border:1px solid var(--incorrect); }
  .feedback .label{ font-weight:700; display:block; margin-bottom:4px; }
  .feedback .explain{ color:var(--charcoal); }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
  }
  .btn{
    background:var(--navy);
    color:#fff;
    border:none;
    padding:11px 22px;
    font-size:14px;
    font-weight:700;
    border-radius:5px;
    cursor:pointer;
    display:none;
    font-family:inherit;
  }
  .btn.show{ display:inline-block; }
  .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn:hover{ background:var(--navy-dark); }

  /* Results screen */
  .results{ display:none; }
  .results.show{ display:block; }
  .quiz-screen.hide{ display:none; }
  .score-hero{
    text-align:center;
    padding:8px 0 6px;
  }
  .score-hero .big{
    font-family:Georgia, serif;
    font-size:48px;
    color:var(--navy);
    font-weight:700;
    line-height:1;
  }
  .score-hero .big span{ color:var(--gold); }
  .score-hero .msg{
    font-size:14.5px;
    color:var(--charcoal);
    max-width:440px;
    margin:12px auto 0;
    line-height:1.5;
  }
  .breakdown{
    margin-top:26px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .breakdown h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--soft-grey);
    margin:0 0 12px;
  }
  .cat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid #F0EBDB;
    font-size:13.5px;
  }
  .cat-row:last-child{ border-bottom:none; }
  .cat-row .name{ color:var(--navy-dark); font-weight:600; }
  .cat-row .fraction{ color:var(--soft-grey); font-family:"Courier New", monospace; }
  .restart-row{
    text-align:center;
    margin-top:26px;
  }
  .btn-outline{
    background:none;
    border:1.5px solid var(--navy);
    color:var(--navy);
    padding:10px 22px;
    font-size:13.5px;
    font-weight:700;
    border-radius:5px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-outline:hover{ background:var(--navy); color:#fff; }
  .btn-outline:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  @media (max-width:420px){
    .bit{ width:18px; height:18px; font-size:9px; }
    .hero h1{ font-size:22px; }
    .card{ padding:20px 18px 18px; }
    .score-hero .big{ font-size:38px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">DIGITAL BRIDGE ACADEMY</span>
  <span class="lesson-tag">Computer Fundamentals · Lesson 2 Practice Quiz</span>
</div>

<div class="wrap">

  <div class="hero">
    <div class="kicker">Post-lesson check</div>
    <h1 id="heroTitle">Test what stuck from the recording</h1>
    <p id="heroSub">21 questions across DNS, HTTP, packets, servers/APIs, and HTTPS. No pressure — this is here to show you what to rewatch, not to grade you.</p>
  </div>

  <div class="byte-meter" id="byteMeter"></div>
  <div class="byte-readout" id="byteReadout"></div>
  <div class="progress-text" id="progressText"></div>

  <!-- QUIZ SCREEN -->
  <div class="card quiz-screen" id="quizScreen">
    <div class="category-tag" id="categoryTag"></div>
    <p class="question" id="questionText"></p>
    <div class="code-block" id="codeBlock" style="display:none;"></div>
    <div class="options" id="optionsWrap"></div>

    <div class="feedback" id="feedback">
      <span class="label" id="feedbackLabel"></span>
      <span class="explain" id="feedbackExplain"></span>
    </div>

    <div class="actions">
      <button class="btn" id="nextBtn">Next question →</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div class="card results" id="resultsScreen">
    <div class="score-hero">
      <div class="big" id="scoreBig"></div>
      <p class="msg" id="scoreMsg"></p>
    </div>
    <div class="breakdown">
      <h3>By topic</h3>
      <div id="categoryBreakdown"></div>
    </div>
    <div class="restart-row">
      <button class="btn-outline" id="restartBtn">Retake the quiz</button>
    </div>
  </div>

</div>

<script>
(function(){

  const ALL_QUESTIONS = [
    // ---- DNS & Addressing ----
    { category:"DNS & Addressing", question:"What does DNS actually do?",
      options:["Encrypts your data in transit","Translates domain names into IP addresses","Speeds up your CPU","Compresses files before sending"], correct:1,
      explanation:"DNS is the internet's phone book — it looks up the numerical IP address behind a human-friendly name like google.com." },
    { category:"DNS & Addressing", question:"Which of these is a valid-looking IPv4 address?",
      options:["142.250.183.14","google.com","https://142.250","42:AB:11"], correct:0,
      explanation:"An IPv4 address is four numbers, 0–255, separated by dots. The others are a domain name, a URL, and a MAC-address-style string." },
    { category:"DNS & Addressing", question:"If a DNS resolver already knows the answer from a recent lookup, what happens?",
      options:["It always asks the root server anyway, just to be safe","It returns the cached answer immediately","It refuses to answer until the cache expires","It contacts the domain's owner directly"], correct:1,
      explanation:"Caching is exactly why the second visit to a site often resolves faster — the resolver skips the full lookup chain." },
    { category:"DNS & Addressing", question:"What's the actual relationship between a domain name and an IP address?",
      options:["They're the same thing, just formatted differently","The domain name is a human-friendly label that DNS maps to the real numerical address","IP addresses are outdated and no longer used","Domain names are assigned randomly on every visit"], correct:1,
      explanation:"Computers still connect using the IP address — the domain name is purely a convenience layer for humans." },

    // ---- HTTP Request-Response ----
    { category:"HTTP Request-Response", question:"In the client-server model, who initiates a typical web request?",
      options:["The server","The client","The router","The DNS resolver"], correct:1,
      explanation:"The client — your browser, or your own script — always asks first. The server only responds." },
    { category:"HTTP Request-Response", question:"Which HTTP method is typically used just to retrieve data without changing anything?",
      options:["POST","DELETE","GET","PUT"], correct:2,
      explanation:"GET is for reading/retrieving. POST, PUT, and DELETE are all methods that change something on the server." },
    { category:"HTTP Request-Response", question:"What does a 404 status code actually tell you?",
      options:["The server crashed","The request succeeded","The server exists, but nothing lives at that path","You're not authenticated"], correct:2,
      explanation:"404 means the server responded fine — it just has nothing at the specific path you asked for." },
    { category:"HTTP Request-Response", question:"What does a 500 status code mean?",
      options:["Your request was malformed","Something broke on the server's side, not yours","The page moved permanently","You need to log in first"], correct:1,
      explanation:"5xx codes mean the problem is on the server's end — your request was fine, something failed while handling it." },
    { category:"HTTP Request-Response", question:"Which part of an HTTP response actually contains the content you asked for, like the HTML or JSON?",
      options:["Headers","Status line","Body","Method"], correct:2,
      explanation:"The body carries the actual payload. Headers and the status line are metadata about that payload." },

    // ---- Packets & Routing ----
    { category:"Packets & Routing", question:"Why is your data broken into packets instead of sent as one continuous stream?",
      options:["It's cheaper for the server to store","It lets pieces travel efficiently and be reassembled, even via different routes","Packets are only used for video calls","It's a legacy requirement no longer actually needed"], correct:1,
      explanation:"Breaking data into numbered packets lets each one take the most efficient path available and still be reassembled correctly at the destination." },
    { category:"Packets & Routing", question:"What does TCP guarantee that UDP does not?",
      options:["Faster delivery","Reliable, ordered delivery, with resending of lost packets","Lower encryption overhead","Smaller file sizes"], correct:1,
      explanation:"TCP confirms every packet arrives and resends missing ones. UDP just sends and moves on — no confirmation." },
    { category:"Packets & Routing", question:"Which of these is the better fit for UDP rather than TCP?",
      options:["Submitting a bank transfer","Downloading a software update","A live video call, where speed matters more than a perfect copy","Loading a webpage"], correct:2,
      explanation:"A dropped video frame is an acceptable trade for speed. The other three need TCP's guarantee that nothing important goes missing." },
    { category:"Packets & Routing", question:"What does the traceroute command actually show you?",
      options:["The CPU usage of a remote server","Each router your data physically passes through on the way to a destination","The binary content of a file","A list of a server's open ports"], correct:1,
      explanation:"Traceroute lists every hop, router by router, between you and the destination — proof that even a fast request is quietly crossing many machines." },
    { category:"Packets & Routing", question:"What is a router's basic job in this journey?",
      options:["Encrypt your data","Pass your packets one hop closer to their destination","Store your data permanently","Translate domain names into IP addresses"], correct:1,
      explanation:"Routers just forward packets toward their destination, hop by hop — they don't store, encrypt, or resolve names." },

    // ---- Servers, Ports & APIs ----
    { category:"Servers, Ports & APIs", question:"What is a server, fundamentally?",
      options:["A special kind of hardware only large companies can own","A program that's listening for incoming requests and knows how to respond","A type of network cable","A DNS record"], correct:1,
      explanation:"Any machine — even your own laptop — can run a server. It's just software listening for requests, not special hardware." },
    { category:"Servers, Ports & APIs", question:"In the building/apartment analogy from the lesson, what is a port?",
      options:["The street address itself","The specific apartment number within a building's address","The building's security guard","A type of encryption"], correct:1,
      explanation:"The IP address gets you to the right building; the port number gets you to the right program running inside it." },
    { category:"Servers, Ports & APIs", question:"What's the standard default port for HTTPS traffic?",
      options:["21","80","443","8080"], correct:2,
      explanation:"443 is the well-known default for HTTPS — which is why you never see it typed in a normal browser URL." },
    { category:"Servers, Ports & APIs", question:"What is a webhook, as described in the lesson?",
      options:["A physical network cable","An API call triggered automatically by an event, rather than a person clicking something","A type of firewall","A DNS server"], correct:1,
      explanation:"A payment provider's webhook is exactly this — one server calling another automatically the moment a payment completes." },

    // ---- HTTPS & Encryption ----
    { category:"HTTPS & Encryption", question:"What does the TLS handshake actually accomplish before your real request is sent?",
      options:["It compresses the file being sent","It agrees on an encryption method and exchanges keys safely","It looks up the destination's IP address","It opens a new browser tab"], correct:1,
      explanation:"The handshake sets up a secure channel first — only after that does your actual (now encryptable) request get sent." },
    { category:"HTTPS & Encryption", question:"If a packet carrying your password is intercepted mid-journey over HTTPS, what happens?",
      options:["The attacker reads it in plain text","It's unreadable without the right key, thanks to encryption","It automatically gets deleted","It's silently rerouted to a safe server"], correct:1,
      explanation:"That's the entire point of HTTPS — interception doesn't matter much if the intercepted data is unreadable without the key." },
    { category:"HTTPS & Encryption", question:"Why do payment integrations like M-Pesa or Flutterwave require HTTPS endpoints?",
      options:["It's just a formality with no real effect","Without it, sensitive data like card numbers could be read as plain text at any hop along the way","It makes the app run faster","It's required for DNS to function"], correct:1,
      explanation:"Every router along the path is a potential eavesdropping point without encryption — HTTPS is what makes payment data safe to send at all." },
  ];

  // ---- Day/section filtering ----
  // Link students to e.g. ?section=binary on Tuesday, ?section=execution on
  // Wednesday, etc. No param (or an unrecognized one) shows the full quiz.
  const SECTION_MAP = {
    dns:      "DNS & Addressing",
    http:     "HTTP Request-Response",
    packets:  "Packets & Routing",
    servers:  "Servers, Ports & APIs",
    https:    "HTTPS & Encryption",
  };
  const SECTION_LABELS = {
    dns:      "DNS & addressing",
    http:     "the HTTP request-response cycle",
    packets:  "packets & routing",
    servers:  "servers, ports & APIs",
    https:    "HTTPS & encryption",
  };
  const urlParams = new URLSearchParams(window.location.search);
  const sectionParam = (urlParams.get('section') || '').toLowerCase();
  const activeCategory = SECTION_MAP[sectionParam] || null;

  const QUESTIONS = activeCategory
    ? ALL_QUESTIONS.filter(q => q.category === activeCategory)
    : ALL_QUESTIONS;

  const heroTitleEl = document.getElementById('heroTitle');
  const heroSubEl = document.getElementById('heroSub');
  if(activeCategory){
    heroTitleEl.textContent = `Quick check: ${SECTION_LABELS[sectionParam]}`;
    heroSubEl.textContent = `${QUESTIONS.length} questions on today's topic. No pressure — this just shows what to rewatch.`;
  }

  const TOTAL = QUESTIONS.length;
  let current = 0;
  let answered = false;
  let score = 0;
  const catStats = {};
  QUESTIONS.forEach(q => { if(!catStats[q.category]) catStats[q.category] = {correct:0, total:0}; catStats[q.category].total++; });

  const quizScreen = document.getElementById('quizScreen');
  const resultsScreen = document.getElementById('resultsScreen');
  const byteMeterEl = document.getElementById('byteMeter');
  const byteReadoutEl = document.getElementById('byteReadout');
  const progressTextEl = document.getElementById('progressText');
  const categoryTagEl = document.getElementById('categoryTag');
  const questionTextEl = document.getElementById('questionText');
  const codeBlockEl = document.getElementById('codeBlock');
  const optionsWrapEl = document.getElementById('optionsWrap');
  const feedbackEl = document.getElementById('feedback');
  const feedbackLabelEl = document.getElementById('feedbackLabel');
  const feedbackExplainEl = document.getElementById('feedbackExplain');
  const nextBtn = document.getElementById('nextBtn');

  function renderByteMeter(answeredCount){
    const bitsOn = Math.round((answeredCount / TOTAL) * 8);
    const placeValues = [128,64,32,16,8,4,2,1];
    let html = '<div class="bits">';
    let decimal = 0;
    for(let i=0;i<8;i++){
      const on = i < bitsOn;
      if(on) decimal += placeValues[i];
      html += `<div class="bit ${on ? 'on':''}">${on ? '1':'0'}</div>`;
    }
    html += '</div>';
    byteMeterEl.innerHTML = html;
    byteReadoutEl.innerHTML = `byte value: <b>${decimal}</b> / 255`;
  }

  function renderQuestion(){
    answered = false;
    const q = QUESTIONS[current];
    categoryTagEl.textContent = q.category;
    questionTextEl.textContent = q.question;

    if(q.code){
      codeBlockEl.style.display = 'block';
      codeBlockEl.textContent = q.code;
    } else {
      codeBlockEl.style.display = 'none';
    }

    optionsWrapEl.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = opt;
      btn.addEventListener('click', () => selectOption(idx));
      optionsWrapEl.appendChild(btn);
    });

    feedbackEl.className = 'feedback';
    nextBtn.classList.remove('show');
    progressTextEl.textContent = `Question ${current + 1} of ${TOTAL}`;
    renderByteMeter(current);
  }

  function selectOption(idx){
    if(answered) return;
    answered = true;
    const q = QUESTIONS[current];
    const buttons = optionsWrapEl.querySelectorAll('.option');
    const isCorrect = idx === q.correct;

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if(i === q.correct) btn.classList.add('correct-answer');
      else if(i === idx) btn.classList.add('wrong-answer');
      else btn.classList.add('dimmed');
    });

    if(isCorrect){
      score++;
      catStats[q.category].correct++;
      feedbackEl.className = 'feedback show is-correct';
      feedbackLabelEl.textContent = 'Correct.';
    } else {
      feedbackEl.className = 'feedback show is-incorrect';
      feedbackLabelEl.textContent = 'Not quite.';
    }
    feedbackExplainEl.textContent = q.explanation;

    nextBtn.textContent = (current === TOTAL - 1) ? 'See results →' : 'Next question →';
    nextBtn.classList.add('show');
    renderByteMeter(current + 1);
  }

  nextBtn.addEventListener('click', () => {
    current++;
    if(current >= TOTAL){
      showResults();
    } else {
      renderQuestion();
    }
  });

  function saveQuizResult(){
    // Posts to your backend if this page is served from within the portal.
    // Fails silently if there's no /api/progress route available yet (e.g. when
    // this file is opened standalone), so the quiz still works either way.
    fetch('/api/progress/quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lessonSlug: 'internet-fundamentals-lesson-2',
        section: sectionParam || 'full',
        score: score,
        totalQuestions: TOTAL,
        categoryBreakdown: catStats,
      }),
    }).catch(function(){ /* no backend wired up yet — that's fine */ });
  }

  function showResults(){
    quizScreen.classList.add('hide');
    document.getElementById('byteMeter').parentElement.style.display = 'none'; // hide progress row wrapper? keep simple
    progressTextEl.style.display = 'none';
    resultsScreen.classList.add('show');

    saveQuizResult();

    const pct = Math.round((score / TOTAL) * 100);
    document.getElementById('scoreBig').innerHTML = `${score}<span>/${TOTAL}</span>`;

    let msg;
    if(pct >= 90) msg = "Strong grasp of the fundamentals — you're ready to move on to Lesson 2.";
    else if(pct >= 70) msg = "Solid overall. Check the topics below and rewatch just those sections before moving on.";
    else msg = "Worth a second pass. Rewatch the recording, focusing on the topics below, then retake this quiz.";
    document.getElementById('scoreMsg').textContent = `${pct}% — ${msg}`;

    const breakdownEl = document.getElementById('categoryBreakdown');
    breakdownEl.innerHTML = '';
    Object.keys(catStats).forEach(cat => {
      const s = catStats[cat];
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `<span class="name">${cat}</span><span class="fraction">${s.correct} / ${s.total}</span>`;
      breakdownEl.appendChild(row);
    });
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0; score = 0; answered = false;
    Object.keys(catStats).forEach(c => catStats[c].correct = 0);
    quizScreen.classList.remove('hide');
    resultsScreen.classList.remove('show');
    document.getElementById('byteMeter').parentElement.style.display = '';
    progressTextEl.style.display = '';
    renderQuestion();
  });

  // init
  renderQuestion();
})();
</script>

</body>
</html>
