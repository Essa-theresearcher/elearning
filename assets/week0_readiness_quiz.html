<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 0 Python Placement Quiz - Digital Bridge Academy</title>
  <style>
    :root {
      --navy: #132a4c;
      --navy-dark: #0b1b33;
      --gold: #c9a227;
      --paper: #ffffff;
      --canvas: #f8faf7;
      --line: #ded9c9;
      --ink: #202633;
      --muted: #66707d;
      --teal: #206d6f;
      --teal-soft: #e2f0ec;
      --rose: #9b594c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
    }

    .heading {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      background: var(--paper);
    }

    .lesson-tag {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 6px 0 8px;
      color: var(--navy-dark);
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0;
    }

    h1 {
      font-size: 30px;
      line-height: 1.12;
    }

    h2 {
      font-size: 22px;
    }

    p {
      color: var(--muted);
    }

    .quiz {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--paper);
    }

    .question strong {
      display: block;
      color: var(--navy-dark);
      font-size: 16px;
    }

    .choice {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--ink);
      cursor: pointer;
    }

    .choice:hover {
      border-color: var(--line);
      background: #fbfcfb;
    }

    .choice input {
      margin-top: 3px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      background: var(--navy);
      color: var(--paper);
      cursor: pointer;
      font-weight: 800;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--navy);
    }

    .result {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: var(--paper);
    }

    .result.good {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .result.review {
      border-color: var(--rose);
      background: #fbefed;
    }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--navy-dark);
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width: 680px) {
      .wrap {
        padding: 16px;
      }

      .breakdown {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="heading">
      <span class="lesson-tag">Week 0 Python Placement Quiz</span>
      <h1>Intermediate Python placement quiz</h1>
      <p>Plan about 45 minutes. Answer every question, then review the category breakdown before submitting the coding review. This checks whether the student is really ready for the intermediate track.</p>
    </section>

    <form id="quizForm" class="quiz"></form>

    <div class="actions">
      <button id="submitBtn" type="button">Submit quiz</button>
      <button class="secondary" id="resetBtn" type="button">Reset answers</button>
    </div>

    <div class="result" id="result" hidden></div>
  </div>

  <script>
    const questions = [
      {
        category: "Variables & types",
        prompt: "What is the value of result after this code?\n\nx = \"5\"\ny = 2\nresult = x * y",
        choices: [
          "\"55\"",
          "10",
          "\"10\"",
          "TypeError"
        ],
        answer: 0
      },
      {
        category: "Variables & types",
        prompt: "Which conversion correctly turns the string \"42\" into an integer?",
        choices: [
          "int(\"42\")",
          "str(\"42\")",
          "list(\"42\")",
          "\"42\".integer()"
        ],
        answer: 0
      },
      {
        category: "Control flow",
        prompt: "What does this code print?\n\nscore = 72\nif score >= 80:\n    print(\"A\")\nelif score >= 70:\n    print(\"B\")\nelse:\n    print(\"C\")",
        choices: [
          "A",
          "B",
          "C",
          "Nothing"
        ],
        answer: 1
      },
      {
        category: "Control flow",
        prompt: "What is total after this loop?\n\ntotal = 0\nfor n in [2, 4, 6]:\n    total += n",
        choices: [
          "6",
          "10",
          "12",
          "[2, 4, 6]"
        ],
        answer: 2
      },
      {
        category: "Functions",
        prompt: "Which function returns a value instead of only printing it?",
        choices: [
          "def add(a, b):\n    print(a + b)",
          "def add(a, b):\n    return a + b",
          "def add(a, b):\n    a + b",
          "def add(a, b)\n    return a + b"
        ],
        answer: 1
      },
      {
        category: "Functions",
        prompt: "What does this function call return?\n\ndef label(score):\n    if score >= 80:\n        return \"ready\"\n    return \"review\"\n\nlabel(79)",
        choices: [
          "\"ready\"",
          "\"review\"",
          "79",
          "None"
        ],
        answer: 1
      },
      {
        category: "Lists & dictionaries",
        prompt: "Which expression gets the value \"Python\" from this dictionary?\n\nprofile = {\"name\": \"Amina\", \"skill\": \"Python\"}",
        choices: [
          "profile[\"skill\"]",
          "profile.skill",
          "profile[1]",
          "profile(\"skill\")"
        ],
        answer: 0
      },
      {
        category: "Lists & dictionaries",
        prompt: "What does items.append(\"c\") do?\n\nitems = [\"a\", \"b\"]",
        choices: [
          "Creates a new dictionary.",
          "Adds \"c\" to the end of the list.",
          "Deletes \"a\" from the list.",
          "Sorts the list alphabetically."
        ],
        answer: 1
      },
      {
        category: "Strings",
        prompt: "What is the value of word[1:4]?\n\nword = \"python\"",
        choices: [
          "\"pyt\"",
          "\"yth\"",
          "\"ytho\"",
          "\"tho\""
        ],
        answer: 1
      },
      {
        category: "Strings",
        prompt: "Which line produces \"Hello, Amina\" using an f-string?",
        choices: [
          "f\"Hello, {name}\"",
          "\"Hello, {name}\"",
          "f(Hello, name)",
          "\"Hello,\" + {name}"
        ],
        answer: 0
      },
      {
        category: "Comprehensions",
        prompt: "What is squares?\n\nsquares = [n * n for n in [1, 2, 3]]",
        choices: [
          "[1, 2, 3]",
          "[2, 4, 6]",
          "[1, 4, 9]",
          "9"
        ],
        answer: 2
      },
      {
        category: "Comprehensions",
        prompt: "Which comprehension keeps only even numbers?",
        choices: [
          "[n for n in nums if n % 2 == 0]",
          "[n if n % 2 == 0 for n in nums]",
          "[n for nums if n % 2 == 0]",
          "[n % 2 == 0 for n]"
        ],
        answer: 0
      },
      {
        category: "OOP",
        prompt: "In Python, what is self normally used for inside a class method?",
        choices: [
          "Referring to the current object instance.",
          "Importing another file.",
          "Stopping a loop.",
          "Converting a string to an integer."
        ],
        answer: 0
      },
      {
        category: "OOP",
        prompt: "What does __init__ usually do in a Python class?",
        choices: [
          "Initializes a new object with starting attributes.",
          "Deletes a class.",
          "Runs only when there is an error.",
          "Imports all methods automatically."
        ],
        answer: 0
      },
      {
        category: "File I/O",
        prompt: "Why is with open(\"data.txt\") as file: commonly used?",
        choices: [
          "It opens the file and helps close it safely after the block.",
          "It permanently deletes the file.",
          "It converts the file to a list automatically.",
          "It only works for images."
        ],
        answer: 0
      },
      {
        category: "Errors",
        prompt: "What should a student look at first in a Python traceback?",
        choices: [
          "The line number and final error type/message.",
          "Only the first word of the file name.",
          "The computer battery level.",
          "The number of blank lines."
        ],
        answer: 0
      },
      {
        category: "Errors",
        prompt: "Which code catches a ValueError from int(user_input)?",
        choices: [
          "try:\n    age = int(user_input)\nexcept ValueError:\n    age = None",
          "if ValueError:\n    age = int(user_input)",
          "catch ValueError:\n    age = None",
          "age = int(user_input) except ValueError"
        ],
        answer: 0
      },
      {
        category: "Reasoning",
        prompt: "A student copies code that works but cannot explain variables, branches, or function returns. What is the best placement decision?",
        choices: [
          "They may need foundations before the intermediate track.",
          "They are automatically intermediate.",
          "Skip all assessments.",
          "Move directly to advanced OOP."
        ],
        answer: 0
      }
    ];

    const form = document.getElementById("quizForm");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submitBtn");
    const resetBtn = document.getElementById("resetBtn");

    function renderQuiz() {
      form.innerHTML = "";
      questions.forEach(function (question, index) {
        const block = document.createElement("section");
        block.className = "question";

        const prompt = document.createElement("strong");
        prompt.textContent = index + 1 + ". " + question.prompt;
        block.appendChild(prompt);

        question.choices.forEach(function (choice, choiceIndex) {
          const label = document.createElement("label");
          label.className = "choice";

          const input = document.createElement("input");
          input.type = "radio";
          input.name = "q" + index;
          input.value = String(choiceIndex);

          const span = document.createElement("span");
          span.textContent = choice;

          label.appendChild(input);
          label.appendChild(span);
          block.appendChild(label);
        });

        form.appendChild(block);
      });
    }

    function gradeQuiz() {
      let score = 0;
      const stats = {};
      questions.forEach(function (question, index) {
        if (!stats[question.category]) {
          stats[question.category] = { correct: 0, total: 0 };
        }
        stats[question.category].total += 1;

        const selected = form.querySelector("input[name='q" + index + "']:checked");
        const selectedIndex = selected ? Number(selected.value) : -1;
        if (selectedIndex === question.answer) {
          score += 1;
          stats[question.category].correct += 1;
        }
      });
      return { score: score, stats: stats };
    }

    function saveQuiz(score, stats) {
      fetch("/api/progress/quiz", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lessonSlug: "intermediate-readiness-week",
          score: score,
          totalQuestions: questions.length,
          categoryBreakdown: stats
        })
      }).catch(function () {
        // The quiz still works if the file is opened without the backend.
      });
    }

    function showResult(score, stats) {
      const pct = Math.round((score / questions.length) * 100);
      const ready = pct >= 75;
      result.hidden = false;
      result.className = "result " + (ready ? "good" : "review");
      result.innerHTML = "";

      const title = document.createElement("h2");
      title.textContent = score + " of " + questions.length + " correct (" + pct + "%)";
      result.appendChild(title);

      const message = document.createElement("p");
      message.textContent = ready
        ? "Good signal. Use the coding review to confirm that the student can apply these ideas."
        : "Review needed. The coding review will show whether the gaps are vocabulary gaps or application gaps.";
      result.appendChild(message);

      const breakdown = document.createElement("div");
      breakdown.className = "breakdown";
      Object.keys(stats).forEach(function (category) {
        const item = document.createElement("div");
        item.className = "stat";
        item.textContent = category + ": " + stats[category].correct + " / " + stats[category].total;
        breakdown.appendChild(item);
      });
      result.appendChild(breakdown);
    }

    submitBtn.addEventListener("click", function () {
      const graded = gradeQuiz();
      saveQuiz(graded.score, graded.stats);
      showResult(graded.score, graded.stats);
      result.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    resetBtn.addEventListener("click", function () {
      form.reset();
      result.hidden = true;
    });

    renderQuiz();
  </script>
</body>
</html>
