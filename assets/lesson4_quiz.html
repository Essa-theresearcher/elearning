<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lesson 4 Practice Quiz - Digital Bridge Academy</title>
<style>
  :root{--navy:#132A4C;--navy-dark:#0B1B33;--gold:#C9A227;--ivory:#FAF6EC;--charcoal:#2B2B2B;--soft-grey:#6E6E6E;--line:#E3D9BE;--correct:#2F6B52;--correct-bg:#EAF3EE;--incorrect:#A04242;--incorrect-bg:#F8EAEA;--code-bg:#0F1F38;--code-text:#E8E3D3;}
  *{box-sizing:border-box} body{margin:0;background:var(--ivory);color:var(--charcoal);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:hidden} .topbar{background:var(--navy);border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap} .brand{color:#fff;font-weight:800} .lesson-tag{color:#D9CDA3;font-size:12.5px} .wrap{max-width:760px;margin:0 auto;padding:28px 18px 70px} .hero{text-align:center;margin-bottom:20px} .kicker{color:var(--gold);font-weight:800;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase} h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-size:28px;margin:6px 0} .hero p{color:var(--soft-grey);font-size:14px;margin:0 auto;max-width:580px} .progress-text{text-align:center;font-size:12.5px;color:var(--soft-grey);margin-bottom:16px} .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px;margin-bottom:18px;box-shadow:0 1px 3px rgba(19,42,76,.06)} .category-tag{display:inline-block;background:var(--ivory);border:1px solid var(--line);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:3px;margin-bottom:14px} .question{font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.5;color:var(--navy-dark);margin:0 0 16px} .options{display:flex;flex-direction:column;gap:9px} .option{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:5px;padding:12px 14px;font-size:14px;color:var(--charcoal);cursor:pointer;font-family:inherit} .option:hover:not(:disabled){border-color:var(--gold);background:var(--ivory)} .option.correct-answer{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);font-weight:800} .option.wrong-answer{border-color:var(--incorrect);background:var(--incorrect-bg);color:var(--incorrect);font-weight:800} .option.dimmed{opacity:.55} .feedback{display:none;margin-top:16px;padding:14px 16px;border-radius:5px;font-size:13.5px;line-height:1.55} .feedback.show{display:block} .feedback.is-correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)} .feedback.is-incorrect{background:var(--incorrect-bg);color:var(--incorrect);border:1px solid var(--incorrect)} .feedback b{display:block;margin-bottom:4px} .next-btn{display:none;margin-top:16px;background:var(--navy);color:#fff;border:none;border-radius:5px;padding:10px 18px;font-weight:800;cursor:pointer} .next-btn.show{display:inline-block} .results{display:none;text-align:center} .results.show{display:block} .score-hero{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px;margin-bottom:18px} .big{font-family:Georgia,"Times New Roman",serif;font-size:52px;color:var(--navy);font-weight:800} .big span{color:var(--gold)} .msg{color:var(--soft-grey)} .cat-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0;font-size:14px} .restart{background:none;border:1.5px solid var(--navy);color:var(--navy);border-radius:5px;padding:10px 18px;font-weight:800;cursor:pointer} @media(max-width:460px){.wrap{padding:22px 12px 56px}.card{padding:18px 16px}.big{font-size:40px}}
</style>
</head>
<body>
<div class="topbar"><span class="brand">Digital Bridge Academy</span><span class="lesson-tag">Computer Fundamentals · Lesson 4 Practice Quiz</span></div>
<div class="wrap">
  <div class="hero"><span class="kicker">Post-lesson check</span><h1 id="heroTitle">Practice Quiz: How Web Applications Actually Work</h1><p>18 questions. This helps you see what to review before moving on.</p></div>
  <div id="quizScreen"><p class="progress-text" id="progressText"></p><div class="card"><span class="category-tag" id="categoryTag"></span><p class="question" id="questionText"></p><div class="options" id="optionsWrap"></div><div class="feedback" id="feedback"><b id="feedbackLabel"></b><span id="feedbackExplain"></span></div><button class="next-btn" id="nextBtn" type="button">Next question</button></div></div>
  <div class="results" id="resultsScreen"><div class="score-hero"><div class="big" id="scoreBig"></div><p class="msg" id="scoreMsg"></p></div><div class="card" id="categoryBreakdown"></div><button class="restart" id="restartBtn" type="button">Retake quiz</button></div>
</div>
<script>
(function(){
  const QUESTIONS = [{'category': 'Architecture', 'question': 'Which part runs in the student browser?', 'options': ['Frontend', 'PostgreSQL database', 'VPS firewall', 'Traefik certificate store'], 'correct': 0, 'explanation': 'The frontend is the page, styles, and JavaScript running in the browser.'}, {'category': 'Architecture', 'question': 'Which part should make trusted decisions like approving course access?', 'options': ['Backend', 'CSS', 'A hidden button', 'The browser address bar'], 'correct': 0, 'explanation': 'The backend is trusted server-side code. Browser UI can be changed by users.'}, {'category': 'Requests', 'question': 'A login form sends username and password to /api/auth/login. What is that?', 'options': ['An API request', 'A database index', 'A DNS lookup only', 'A video upload'], 'correct': 0, 'explanation': 'The browser sends an HTTP request to a backend route.'}, {'category': 'Requests', 'question': 'What should the backend do before saving user-submitted data?', 'options': ['Validate it', 'Trust everything', 'Hide the form with CSS', 'Change the domain'], 'correct': 0, 'explanation': 'Validation protects the app from bad or unsafe input.'}, {'category': 'Database', 'question': 'Why does the backend talk to the database?', 'options': ['To save and read app state', 'To draw the page colors', 'To resolve the domain name', 'To generate Wi-Fi'], 'correct': 0, 'explanation': 'The database stores users, enrollments, progress, resources, and results.'}, {'category': 'Authentication', 'question': 'Authentication answers which question?', 'options': ['Who are you?', 'Which color is the button?', 'Which DNS provider is used?', 'How wide is the screen?'], 'correct': 0, 'explanation': 'Authentication proves identity.'}, {'category': 'Authorization', 'question': 'Authorization answers which question?', 'options': ['What are you allowed to do?', 'What is your IP address?', 'What is the screen size?', 'What is the video duration?'], 'correct': 0, 'explanation': 'Authorization checks permissions after identity is known.'}, {'category': 'Sessions', 'question': 'Why does the app use a session cookie after login?', 'options': ['So the browser can prove it is still signed in', 'So DNS works faster', 'So videos become smaller', 'So CSS can load'], 'correct': 0, 'explanation': 'The session cookie is sent on later requests to identify the signed-in session.'}, {'category': 'Roles', 'question': 'Which role should approve student checkout?', 'options': ['Admin', 'Student', 'Anonymous visitor', 'CSS file'], 'correct': 0, 'explanation': 'Admin is responsible for enrollment approval.'}, {'category': 'Deployment', 'question': 'What does a reverse proxy like Traefik do?', 'options': ['Routes domain traffic to the correct app/port', 'Stores quiz answers', 'Writes Python code', 'Creates database rows by itself'], 'correct': 0, 'explanation': 'A reverse proxy receives web traffic and forwards it to the right service.'}, {'category': 'Deployment', 'question': 'What does DATABASE_URL configure?', 'options': ['How the app connects to PostgreSQL', 'The homepage title', 'The browser zoom', 'The CSS color palette'], 'correct': 0, 'explanation': 'DATABASE_URL tells the backend where the database is and how to authenticate.'}, {'category': 'Deployment', 'question': 'If DNS is correct but the IP times out on every port, where is the problem likely?', 'options': ['VPS/network/firewall/service availability', 'The lesson quiz wording', 'The page font', 'A missing comma in HTML only'], 'correct': 0, 'explanation': 'A timeout at the IP means traffic is not reaching a responding service.'}, {'category': 'Static vs Dynamic', 'question': 'What makes an LMS a dynamic web application?', 'options': ['It changes based on login, database state, and user actions', 'It has a nice homepage image only', 'It has a domain name', 'It has one HTML file'], 'correct': 0, 'explanation': 'Dynamic apps produce different behavior based on data and users.'}, {'category': 'Security', 'question': 'Why should COOKIE_SECURE be 1 when HTTPS is working?', 'options': ['So auth cookies are only sent over HTTPS', 'So the database port opens', 'So videos play louder', 'So DNS points faster'], 'correct': 0, 'explanation': 'Secure cookies reduce the chance of session tokens being sent over plain HTTP.'}, {'category': 'Debugging', 'question': 'What is a good order for debugging a domain that does not open?', 'options': ['DNS, firewall, proxy, app port, app logs', 'Change every setting randomly', 'Delete the database first', 'Rename all files'], 'correct': 0, 'explanation': 'Layered debugging keeps other apps safe.'}, {'category': 'Logs', 'question': 'Why are logs useful in production?', 'options': ['They show errors and requests that users cannot see', 'They replace backups', 'They encrypt passwords automatically', 'They create domains'], 'correct': 0, 'explanation': 'Logs help you find what failed on the server.'}, {'category': 'Frontend', 'question': 'Why should the frontend still show helpful validation messages?', 'options': ['To guide users before the backend final check', 'To replace backend validation', 'To approve students directly', 'To change firewall rules'], 'correct': 0, 'explanation': 'Frontend validation improves UX, but the backend still must enforce rules.'}, {'category': 'Full Flow', 'question': 'A student submits an activity and the teacher sees it later. Which flow is most accurate?', 'options': ['Browser -> backend API -> database -> teacher dashboard reads it', 'Browser -> CSS -> DNS -> video file', 'Database -> student browser without backend', 'Domain registrar -> quiz frame only'], 'correct': 0, 'explanation': 'The backend receives the submission, saves it, and the teacher dashboard reads it later.'}];
  const TOTAL = QUESTIONS.length;
  let current = 0, score = 0, answered = false, answerDetails = [];
  const catStats = {};
  QUESTIONS.forEach(function(q){if(!catStats[q.category])catStats[q.category]={correct:0,total:0};catStats[q.category].total++;});
  const quizScreen=document.getElementById('quizScreen'),resultsScreen=document.getElementById('resultsScreen'),progressTextEl=document.getElementById('progressText'),categoryTagEl=document.getElementById('categoryTag'),questionTextEl=document.getElementById('questionText'),optionsWrapEl=document.getElementById('optionsWrap'),feedbackEl=document.getElementById('feedback'),feedbackLabelEl=document.getElementById('feedbackLabel'),feedbackExplainEl=document.getElementById('feedbackExplain'),nextBtn=document.getElementById('nextBtn');
  function renderQuestion(){answered=false;const q=QUESTIONS[current];categoryTagEl.textContent=q.category;questionTextEl.textContent=q.question;optionsWrapEl.innerHTML='';q.options.forEach(function(opt,idx){const btn=document.createElement('button');btn.className='option';btn.type='button';btn.textContent=opt;btn.addEventListener('click',function(){selectOption(idx);});optionsWrapEl.appendChild(btn);});feedbackEl.className='feedback';nextBtn.classList.remove('show');progressTextEl.textContent='Question '+(current+1)+' of '+TOTAL;}
  function selectOption(idx){if(answered)return;answered=true;const q=QUESTIONS[current];const buttons=optionsWrapEl.querySelectorAll('.option');const isCorrect=idx===q.correct;answerDetails[current]={questionNumber:current+1,category:q.category,question:q.question,selectedAnswer:q.options[idx],correctAnswer:q.options[q.correct],isCorrect:isCorrect,explanation:q.explanation,section:'full'};buttons.forEach(function(btn,i){btn.disabled=true;if(i===q.correct)btn.classList.add('correct-answer');else if(i===idx)btn.classList.add('wrong-answer');else btn.classList.add('dimmed');});if(isCorrect){score++;catStats[q.category].correct++;feedbackEl.className='feedback show is-correct';feedbackLabelEl.textContent='Correct.';}else{feedbackEl.className='feedback show is-incorrect';feedbackLabelEl.textContent='Not quite.';}feedbackExplainEl.textContent=q.explanation;nextBtn.textContent=(current===TOTAL-1)?'See results':'Next question';nextBtn.classList.add('show');}
  nextBtn.addEventListener('click',function(){current++;if(current>=TOTAL)showResults();else renderQuestion();});
  function saveQuizResult(){fetch('/api/progress/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lessonSlug:'web-applications-lesson-4',section:'full',score:score,totalQuestions:TOTAL,categoryBreakdown:catStats,answerDetails:answerDetails})}).catch(function(){});}
  function showResults(){quizScreen.style.display='none';resultsScreen.classList.add('show');saveQuizResult();const pct=Math.round((score/TOTAL)*100);document.getElementById('scoreBig').innerHTML=score+'<span>/'+TOTAL+'</span>';let msg=pct>=90?'Excellent. You are ready for the next lesson.':pct>=70?'Solid. Review the lower categories before moving on.':'Take another pass through the videos and reading, then retake the quiz.';document.getElementById('scoreMsg').textContent=pct+'% - '+msg;const breakdown=document.getElementById('categoryBreakdown');breakdown.innerHTML='';Object.keys(catStats).forEach(function(cat){const s=catStats[cat];const row=document.createElement('div');row.className='cat-row';row.innerHTML='<span>'+cat+'</span><span>'+s.correct+' / '+s.total+'</span>';breakdown.appendChild(row);});}
  document.getElementById('restartBtn').addEventListener('click',function(){current=0;score=0;answered=false;answerDetails=[];Object.keys(catStats).forEach(function(c){catStats[c].correct=0;});quizScreen.style.display='';resultsScreen.classList.remove('show');renderQuestion();});
  renderQuestion();
})();
</script>
</body>
</html>
